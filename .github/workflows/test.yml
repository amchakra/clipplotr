name: tests

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    container: bioconductor/bioconductor_docker:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: Rscript install_libraries.R

      - name: Run smoke tests
        run: bash test/run_tests.sh plots

      - name: Upload plots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-plots
          path: plots
