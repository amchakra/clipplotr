# You can use this file to create a conda environment for clipplotr:
# conda env create -f environment.yml

name: clipplotr

channels:
  - conda-forge
  - bioconda

dependencies:
  - conda-forge::r-base>=4.3
  - conda-forge::r-optparse
  - conda-forge::r-ggplot2>=3.5.0
  - conda-forge::r-scales
  - conda-forge::r-patchwork
  - conda-forge::r-data.table

  - bioconda::bioconductor-genomeinfodb
  - bioconda::bioconductor-rtracklayer
  - bioconda::bioconductor-genomicfeatures
  - bioconda::bioconductor-txdbmaker
